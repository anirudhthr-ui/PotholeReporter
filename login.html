<!DOCTYPE html>
<html>

<head>
    <title>Pothole Reporter - Login</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <header>
            <h1>🚧 Pothole Reporter</h1>
            <p>Login to your account</p>
        </header>

        <main>

            <section class="report-card">

    <h2 id="formTitle">Welcome Back!</h2>

    <input
        type="email"
        id="email"
        placeholder="Email"
    >

    <input
        type="password"
        id="password"
        placeholder="Password"
    >

    <button id="loginButton">
        Login
    </button>

    <p>
        <span id="switchText">Don't have an account?</span>
        <a href="#" id="switchMode">Create one</a>
    </p>

    <p id="message"></p>

</section>

        </main>

    </div>
<script type="module">

    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js";

    

    import {
        getAuth,
        createUserWithEmailAndPassword,
        signInWithEmailAndPassword
    } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-auth.js";


    const firebaseConfig = {
  apiKey: "AIzaSyDc_S37EbeMpNagPOUH7PsKbLmwwmRjLjw",
  authDomain: "pothole-reporter-d3106.firebaseapp.com",
  projectId: "pothole-reporter-d3106",
  storageBucket: "pothole-reporter-d3106.firebasestorage.app",
  messagingSenderId: "1066650937630",
  appId: "1:1066650937630:web:6cb5af118b5529ab32c10f",
  measurementId: "G-5HKX1REJ9J"
};

    const app = initializeApp(firebaseConfig);

   
    const auth = getAuth(app);


    const emailInput = document.getElementById("email");
    const passwordInput = document.getElementById("password");
    const loginButton = document.getElementById("loginButton");
    const switchMode = document.getElementById("switchMode");
    const formTitle = document.getElementById("formTitle");
    const switchText = document.getElementById("switchText");
    const message = document.getElementById("message");


    let signupMode = false;


    switchMode.addEventListener("click", function(event) {

        event.preventDefault();

        signupMode = !signupMode;

        if (signupMode) {

            formTitle.textContent = "Create Account";

            loginButton.textContent = "Create Account";

            switchText.textContent = "Already have an account?";

            switchMode.textContent = "Login";

        } else {

            formTitle.textContent = "Welcome Back!";

            loginButton.textContent = "Login";

            switchText.textContent = "Don't have an account?";

            switchMode.textContent = "Create one";

        }

    });
    loginButton.addEventListener("click", function() {

    const email = emailInput.value;
    const password = passwordInput.value;

    if (signupMode) {

        createUserWithEmailAndPassword(auth, email, password)
            .then(function(userCredential) {

                message.textContent = "✅ Account created successfully!";

            })
            .catch(function(error) {

                message.textContent = "❌ " + error.message;

            });

    } else {

        signInWithEmailAndPassword(auth, email, password)
            .then(function(userCredential) {

    message.textContent = "✅ Login successful!";

    setTimeout(function() {
        window.location.href = "dashboard.html";
    }, 1000);

})
            .catch(function(error) {

                message.textContent = "❌ Incorrect email or password.";

            });

    }

});

</script>
</body>

</html>
