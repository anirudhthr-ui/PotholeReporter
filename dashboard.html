
<!DOCTYPE html>
<html>

<head>
    <title>Pothole Reporter - Dashboard</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <header>
            <h1>My Dashboard</h1>
            <p id="welcomeMessage">View your pothole reports and detections.</p>
        </header>

        <nav>
            <a href="index.html">📍 Report Pothole</a>
            <a href="dashboard.html">📊 Dashboard</a>
            <a href="login.html">👤 Login</a>
        </nav>

        <main>

            <section class="report-card">
                <h2>Possible Detections</h2>

                <div id="detectionsList">

                    <div class="detection-card" id="detection1">

                        <h3>⚠️ Possible Pothole</h3>

                        <p>📍 Main Road, Hyderabad</p>

                        <p>🕐 Detected today</p>

                        <p>This detection was automatically recorded by the road-monitoring device.</p>

                        <button onclick="reportDetection()">Report</button>
                        <button onclick="ignoreDetection()">Ignore</button>

                        <p id="detectionMessage"></p>

                    </div>

                </div>

            </section>


            <section class="reports">

                <h2>My Reports</h2>

                <div id="myReports">
                    <p id="savedLocation"></p>
                    <p id="savedDescription"></p>
                </div>

            </section>

        </main>

    </div>


    <script type="module">

        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js";

        import {
            getAuth,
            onAuthStateChanged
        } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-auth.js";
import {
    getFirestore,
    collection,
    query,
    where,
    getDocs
} from "https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore.js";

        // Firebase configuration

        const firebaseConfig = {
            apiKey: "AIzaSyDc_S37EbeMpNagPOUH7PsKbLmwwmRjLjw",
            authDomain: "pothole-reporter-d3106.firebaseapp.com",
            projectId: "pothole-reporter-d3106",
            storageBucket: "pothole-reporter-d3106.firebasestorage.app",
            messagingSenderId: "1066650937630",
            appId: "1:1066650937630:web:6cb5af118b5529ab32c10f",
            measurementId: "G-5HKX1REJ9J"
        };


        // Initialize Firebase

        const app = initializeApp(firebaseConfig);

        const auth = getAuth(app);
        const db = getFirestore(app);


        // Check logged-in user

        onAuthStateChanged(auth, function(user) {

            const welcomeMessage =
                document.getElementById("welcomeMessage");

            if (user) {

                welcomeMessage.textContent =
                    "Welcome, " + user.email + "! 👋";

            } else {

                welcomeMessage.textContent =
                    "You are not logged in.";

            }

        });


        // Possible detection - Report

        window.reportDetection = function() {

            document.getElementById("detection1").innerHTML = `
                <h3>🟠 Pothole Reported</h3>
                <p>📍 Main Road, Hyderabad</p>
                <p>🕐 Detected today</p>
                <p class="status">Status: Pending</p>
            `;

        };


        // Possible detection - Ignore

        window.ignoreDetection = function() {

            document.getElementById("detection1").innerHTML = `
                <h3>✓ Detection Ignored</h3>
                <p>This possible pothole was not reported.</p>
            `;

        };


        // Load reports from Firestore

const myReports = document.getElementById("myReports");

onAuthStateChanged(auth, async function(user) {

    if (!user) {
        myReports.innerHTML = "<p>Please login to see your reports.</p>";
        return;
    }

    try {

        const reportsQuery = query(
            collection(db, "potholeReports"),
            where("userId", "==", user.uid)
        );

        const querySnapshot = await getDocs(reportsQuery);

        myReports.innerHTML = "";

        if (querySnapshot.empty) {

            myReports.innerHTML = "<p>You haven't reported any potholes yet.</p>";
            return;

        }

        querySnapshot.forEach(function(doc) {

            const report = doc.data();

            myReports.innerHTML += `
                <div class="detection-card">

                    <h3>📍 Pothole Report</h3>

                    <p>Location: ${report.location}</p>

                    <p>Description: ${report.description}</p>

                    <img
                        src="${report.photo}"
                        alt="Pothole photo"
                        class="report-photo"
                    >

                    <p class="status">Status: ${report.status}</p>

                </div>
            `;

        });

    } catch (error) {

        console.error("Error loading reports:", error);

        myReports.innerHTML =
            "<p>Unable to load your reports.</p>";

    }

});

    </script>

</body>

</html>
